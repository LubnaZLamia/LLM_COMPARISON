{% extends "base.html" %}
{% block content %}
<div class="card form-card">
  <p class="eyebrow">Dataset</p>
  <h1>Delete message?</h1>
  <p>"{{ object.text }}"</p>
  <p class="hint">Past comparison runs are kept, but will no longer link to this message.</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <a class="btn-ghost" href="{% url 'dataset:list' %}">Cancel</a>
    <button class="btn-danger" type="submit"><svg class="ico"><use href="#i-trash"></use></svg>Delete</button>
  </form>
</div>
{% endblock %}
